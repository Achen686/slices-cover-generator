<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切片封面图生成器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- 钉钉进步体 (cn-fontsource CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-ding-talk-jin-bu-ti-regular@1.0.3/font.css">
<style>
  .font-cover { font-family: 'SimHei', 'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif; }
  @font-face {
    font-family: 'Alimama FangYuanTi VF';
    src: url('AlimamaFangYuanTiVF.woff2') format('woff2');
    font-display: swap;
  }
  .preview-container {
    width: 512px; height: 288px; overflow: hidden;
    border: 2px solid #334155; border-radius: 8px;
  }
  .template-stage {
    width: 1280px; height: 720px;
    transform: scale(0.4); transform-origin: top left;
  }
  .render-stage {
    width: 1280px; height: 720px; overflow: hidden;
    position: absolute; left: -9999px; top: 0;
  }
  .clip-row input { min-width: 0; }
  .template-btn {
    transition: all 0.15s ease;
  }
  .template-btn.active {
    border-color: #3b82f6 !important;
    background-color: #1e3a5f !important;
    box-shadow: 0 0 0 2px #3b82f6;
  }
  .mode-btn.active {
    border-color: #22c55e !important;
    background-color: #14532d !important;
    box-shadow: 0 0 0 2px #22c55e;
  }
  #progress-bar {
    transition: width 0.15s ease;
  }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-cover">

<!-- Header -->
<header class="border-b border-slate-700 px-6 py-4 flex items-center justify-between">
  <h1 class="text-xl font-bold tracking-tight">切片封面图生成器</h1>
  <div class="flex items-center gap-3">
    <span class="text-xs text-slate-500">1280×720 · 6套模板 · 批量打包下载</span>
    <span class="text-xs text-slate-600">|</span>
    <span class="text-xs text-slate-400">下载次数: <strong id="download-count" class="text-blue-400">0</strong></span>
    <button id="reset-count-btn" class="text-[10px] text-slate-600 hover:text-red-400 transition underline" title="清零下载次数">重置</button>
  </div>
</header>

<!-- Hidden render stage for html2canvas capture at full resolution -->
<div id="render-stage" class="render-stage"></div>

<!-- Main layout -->
<div id="main-layout" class="flex gap-0">

  <!-- Left: Control Panel -->
  <aside class="w-[320px] min-w-[280px] border-r border-slate-700 p-3 flex flex-col gap-2.5 overflow-y-auto">

    <!-- Template Selector -->
    <section>
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5 block">模板选择</label>
      <div class="flex gap-1 mb-1">
        <span class="text-[9px] text-slate-600 w-7 self-center flex-shrink-0">吸顶</span>
        <button data-template="top-1" class="template-btn flex-1 py-1.5 px-1 rounded-lg border-2 border-slate-600 bg-slate-800 hover:border-blue-500 text-[11px] font-semibold">左上</button>
        <button data-template="top-2" class="template-btn flex-1 py-1.5 px-1 rounded-lg border-2 border-slate-600 bg-slate-800 hover:border-blue-500 text-[11px] font-semibold">居中</button>
        <button data-template="top-3" class="template-btn flex-1 py-1.5 px-1 rounded-lg border-2 border-slate-600 bg-slate-800 hover:border-blue-500 text-[11px] font-semibold">大字</button>
      </div>
      <div class="flex gap-1">
        <span class="text-[9px] text-slate-600 w-7 self-center flex-shrink-0">吸底</span>
        <button data-template="bottom-1" class="template-btn active flex-1 py-1.5 px-1 rounded-lg border-2 border-slate-600 bg-slate-800 hover:border-blue-500 text-[11px] font-semibold">左下</button>
        <button data-template="bottom-2" class="template-btn flex-1 py-1.5 px-1 rounded-lg border-2 border-slate-600 bg-slate-800 hover:border-blue-500 text-[11px] font-semibold">居中</button>
        <button data-template="bottom-3" class="template-btn flex-1 py-1.5 px-1 rounded-lg border-2 border-slate-600 bg-slate-800 hover:border-blue-500 text-[11px] font-semibold">大字</button>
      </div>
    </section>

    <!-- Font & Mask Settings -->
    <section>
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5 block">字体 & 蒙版</label>
      <div class="flex items-center gap-2 mb-1.5">
        <div class="flex items-center gap-1">
          <span class="text-[11px] text-slate-500">字色</span>
          <input id="color-picker" type="color" value="#ffffff" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent">
        </div>
        <div class="flex items-center gap-1">
          <span class="text-[11px] text-slate-500">描边</span>
          <input id="stroke-color-picker" type="color" value="#000000" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent">
        </div>
        <div class="flex items-center gap-1">
          <input id="stroke-width-slider" type="range" min="0" max="6" value="1" step="0.5" class="w-12 h-1.5 accent-blue-500 cursor-pointer">
          <span id="stroke-width-label" class="text-[10px] text-slate-400">1px</span>
        </div>
        <span class="text-[11px] text-slate-500">大小</span>
        <input id="size-slider" type="range" min="50" max="200" value="100" class="w-14 h-1.5 accent-blue-500 cursor-pointer">
        <span id="size-label" class="text-[10px] text-slate-400">100%</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-slate-500 whitespace-nowrap">字体</span>
        <select id="font-select" class="flex-1 bg-slate-800 border border-slate-600 rounded px-1.5 py-1 text-[11px] text-slate-200 focus:outline-none focus:border-blue-500 cursor-pointer">
          <option value="default">系统黑体</option>
          <option value="dingtalk">钉钉进步体</option>
          <option value="fangyuan">阿里妈妈方圆体</option>
        </select>
        <span class="text-[11px] text-slate-500 whitespace-nowrap">蒙版</span>
        <input id="mask-opacity-slider" type="range" min="0" max="100" value="100" class="w-14 h-1.5 accent-blue-500 cursor-pointer">
        <span id="mask-opacity-label" class="text-[10px] text-slate-400">100%</span>
      </div>
    </section>

    <!-- Clip Data -->
    <section class="flex flex-col">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block whitespace-nowrap">切片列表</label>

      <!-- Excel import area -->
      <label class="flex items-center justify-center gap-2 bg-slate-800 border-2 border-dashed border-slate-600 rounded-lg p-2 cursor-pointer hover:border-green-500 transition text-xs text-slate-400 mb-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5-5m0 0l5 5m-5-5v12"/></svg>
        点击上传 Excel 文件
        <input id="excel-input" type="file" accept=".xlsx,.xls" class="hidden">
      </label>
      <div class="flex justify-end mb-2">
        <button id="download-template-btn" class="text-[11px] text-slate-500 hover:text-slate-300 underline transition">下载 Excel 模板</button>
      </div>

      <!-- Local background image -->
      <div class="flex gap-1.5 mb-2">
        <label class="flex-1 flex items-center gap-1 bg-slate-800 border border-dashed border-slate-600 rounded-lg px-2 py-1.5 cursor-pointer hover:border-amber-500 transition text-xs text-slate-400 min-w-0">
          <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span id="bg-upload-label" class="truncate">上传本地底图</span>
          <input id="bg-image-input" type="file" accept="image/*" class="hidden">
        </label>
        <button id="reupload-btn" class="text-[11px] text-slate-500 hover:text-slate-300 underline transition hidden flex-shrink-0">重新上传</button>
        <button id="apply-bg-all-btn" class="bg-amber-700 hover:bg-amber-600 border border-amber-600 text-white font-semibold py-1.5 px-2 rounded-lg text-[11px] transition disabled:opacity-30 disabled:cursor-not-allowed flex-shrink-0 whitespace-nowrap" disabled>应用为所有</button>
      </div>

      <div id="clip-list" class="space-y-1 pr-1 min-h-[60px]" tabindex="0">
        <!-- Dynamically populated -->
      </div>
      <button id="add-clip-btn" class="mt-1.5 w-full bg-slate-800 hover:bg-slate-700 border border-dashed border-slate-600 text-slate-400 hover:text-slate-200 py-1.5 rounded-lg text-xs transition">
        + 添加一行
      </button>
    </section>

    <!-- Download Button -->
    <button id="generate-btn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-2.5 rounded-xl text-sm transition disabled:opacity-40 disabled:cursor-not-allowed shadow-lg">
      下载全部封面图 (ZIP)
    </button>

    <!-- Progress -->
    <div id="progress-container" class="hidden">
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span id="progress-text">打包中...</span>
        <span id="progress-count">0/0</span>
      </div>
      <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-full rounded-full transition-all" style="width: 0%"></div>
      </div>
    </div>
  </aside>

  <!-- Right: Preview Area -->
  <main class="flex-1 flex items-center justify-center bg-slate-950 p-6">
    <div class="flex flex-col items-center gap-4">
      <span class="text-xs text-slate-500">实时预览 · 1280×720 (缩略显示)</span>
      <div class="preview-container bg-slate-900 shadow-2xl" id="preview-wrapper">
        <div class="template-stage font-cover" id="preview-stage"></div>
      </div>
      <p id="preview-hint" class="text-xs text-slate-500">请添加切片标题并加载封面图</p>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
// ==================== CDN CHECK ====================
const missingLibs = [];
if (typeof XLSX === 'undefined') missingLibs.push('XLSX (Excel)');
if (typeof JSZip === 'undefined') missingLibs.push('JSZip (ZIP)');
if (typeof html2canvas === 'undefined') missingLibs.push('html2canvas (截图)');
if (missingLibs.length > 0) {
  document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#f1f5f9;font-family:sans-serif;"><div style="text-align:center;max-width:420px;padding:24px;"><h1 style="font-size:24px;margin-bottom:16px;">组件加载失败</h1><p style="color:#94a3b8;margin-bottom:8px;">以下组件未能加载：${missingLibs.join('、')}</p><p style="color:#94a3b8;margin-bottom:16px;">可能原因：网络连接不稳定或 CDN 资源不可用。</p><button onclick="location.reload()" style="background:#3b82f6;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:16px;">刷新重试</button></div></div>`;
  return;
}

// ==================== STATE ====================
const ALL_TEMPLATES = ['top-1','top-2','top-3','bottom-1','bottom-2','bottom-3'];
let currentTemplate = 'bottom-1';
let clips = []; // { title, imageUrl }
let previewIndex = 0; // which clip the preview shows
let listExpanded = false;
let titleColor = '#ffffff';
let fontScale = 1.0;
let strokeColor = '#000000';
let strokeWidth = 1;
let fontFamily = 'default';
let maskOpacity = 1.0;
let localBgDataUrl = null; // uploaded local background image
let isGenerating = false;
let downloadCount = parseInt(localStorage.getItem('coverDownloadCount') || '0', 10);

function updateDownloadCountDisplay() {
  const el = $('#download-count');
  if (el) el.textContent = downloadCount;
}

function incrementDownloadCount() {
  downloadCount++;
  localStorage.setItem('coverDownloadCount', downloadCount.toString());
  updateDownloadCountDisplay();
}

// ==================== DOM REFS ====================
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const previewStage = $('#preview-stage');
const renderStage = $('#render-stage');
const clipList = $('#clip-list');
const generateBtn = $('#generate-btn');
const progressContainer = $('#progress-container');
const progressBar = $('#progress-bar');
const progressText = $('#progress-text');
const progressCount = $('#progress-count');
const previewHint = $('#preview-hint');

// ==================== TEMPLATES ====================
// All 6 templates: cover image as full background + gradient overlay mask + title text
// Font: 黑体 (SimHei)

function buildTemplate(type, customImage, titleOverride) {
  const FONT = fontFamily === 'dingtalk' ? "'DingTalk JinBuTi','SimHei','PingFang SC','Microsoft YaHei',sans-serif" : fontFamily === 'fangyuan' ? "'Alimama FangYuanTi VF','SimHei','PingFang SC','Microsoft YaHei',sans-serif" : "'SimHei','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif";
  const imgSrc = customImage || '';
  const title = titleOverride || '示例标题';
  const tc = titleColor;
  const fs = (s) => Math.round(s * fontScale);
  const sw = strokeWidth;
  const sc = strokeColor;
  const ss = `-${sw}px -${sw}px 0 ${sc},${sw}px -${sw}px 0 ${sc},-${sw}px ${sw}px 0 ${sc},${sw}px ${sw}px 0 ${sc}`;
	const mo = maskOpacity;
	const ms = Math.min(1, mo).toFixed(2);
	const mm = Math.min(1, 0.72 * mo).toFixed(2);

  const bgStyle = imgSrc
    ? `background-image:url(${imgSrc});background-size:cover;background-position:center;`
    : `background:#374151;`;

  // Common wrapper: full 1280x720 with bg image
  const wrapOpen = `<div style="width:1280px;height:720px;${bgStyle}position:relative;overflow:hidden;font-family:${FONT};">`;
  const placeholder = imgSrc ? '' : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:20px;z-index:0;">封面图预览区</div>`;
  const wrapClose = `</div>`;

  // ---- 吸顶模板 (蒙版在顶部) ----
  if (type === 'top-1') {
    return `${wrapOpen}${placeholder}
      <div style="position:absolute;top:0;left:0;right:0;height:210px;background:linear-gradient(180deg,rgba(0,0,0,${ms}) 0%,rgba(0,0,0,${mm}) 50%,transparent 100%);z-index:1;"></div>
      <div style="position:absolute;top:30px;left:48px;z-index:2;max-width:1050px;">
        <div style="color:${tc};font-size:${fs(81)}px;font-weight:900;line-height:1.25;letter-spacing:2px;text-shadow:${ss},0 2px 8px rgba(0,0,0,0.5);" id="tmpl-title">${title}</div>
      </div>
      ${wrapClose}`;
  }

  if (type === 'top-2') {
    return `${wrapOpen}${placeholder}
      <div style="position:absolute;top:0;left:0;right:0;height:225px;background:linear-gradient(180deg,rgba(0,0,0,${ms}) 0%,rgba(0,0,0,${mm}) 50%,transparent 100%);z-index:1;"></div>
      <div style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;">
        <div style="color:${tc};font-size:${fs(84)}px;font-weight:900;line-height:1.25;letter-spacing:3px;text-shadow:${ss},0 2px 10px rgba(0,0,0,0.5);text-align:center;max-width:1050px;" id="tmpl-title">${title}</div>
      </div>
      ${wrapClose}`;
  }

  if (type === 'top-3') {
    return `${wrapOpen}${placeholder}
      <div style="position:absolute;top:0;left:0;right:0;height:255px;background:linear-gradient(180deg,rgba(0,0,0,${ms}) 0%,rgba(0,0,0,${mm}) 50%,transparent 100%);z-index:1;"></div>
      <div style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;">
        <div style="color:${tc};font-size:${fs(108)}px;font-weight:900;line-height:1.15;letter-spacing:4px;text-shadow:${ss},0 3px 12px rgba(0,0,0,0.5);text-align:center;max-width:1050px;" id="tmpl-title">${title}</div>
      </div>
      ${wrapClose}`;
  }

  // ---- 吸底模板 (蒙版在底部) ----
  if (type === 'bottom-1') {
    return `${wrapOpen}${placeholder}
      <div style="position:absolute;bottom:0;left:0;right:0;height:210px;background:linear-gradient(0deg,rgba(0,0,0,${ms}) 0%,rgba(0,0,0,${mm}) 50%,transparent 100%);z-index:1;"></div>
      <div style="position:absolute;bottom:46px;left:48px;z-index:2;max-width:1050px;">
        <div style="color:${tc};font-size:${fs(81)}px;font-weight:900;line-height:1.25;letter-spacing:2px;text-shadow:${ss},0 2px 8px rgba(0,0,0,0.5);" id="tmpl-title">${title}</div>
      </div>
      ${wrapClose}`;
  }

  if (type === 'bottom-2') {
    return `${wrapOpen}${placeholder}
      <div style="position:absolute;bottom:0;left:0;right:0;height:225px;background:linear-gradient(0deg,rgba(0,0,0,${ms}) 0%,rgba(0,0,0,${mm}) 50%,transparent 100%);z-index:1;"></div>
      <div style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;">
        <div style="color:${tc};font-size:${fs(84)}px;font-weight:900;line-height:1.25;letter-spacing:3px;text-shadow:${ss},0 2px 10px rgba(0,0,0,0.5);text-align:center;max-width:1050px;" id="tmpl-title">${title}</div>
      </div>
      ${wrapClose}`;
  }

  if (type === 'bottom-3') {
    return `${wrapOpen}${placeholder}
      <div style="position:absolute;bottom:0;left:0;right:0;height:255px;background:linear-gradient(0deg,rgba(0,0,0,${ms}) 0%,rgba(0,0,0,${mm}) 50%,transparent 100%);z-index:1;"></div>
      <div style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;">
        <div style="color:${tc};font-size:${fs(108)}px;font-weight:900;line-height:1.15;letter-spacing:4px;text-shadow:${ss},0 3px 12px rgba(0,0,0,0.5);text-align:center;max-width:1050px;" id="tmpl-title">${title}</div>
      </div>
      ${wrapClose}`;
  }

  // Fallback
  return `${wrapOpen}${placeholder}${wrapClose}`;
}

// ==================== RENDER ====================
function renderBoth(customImage, titleOverride) {
  const html = buildTemplate(currentTemplate, customImage, titleOverride);
  previewStage.innerHTML = html;
  renderStage.innerHTML = html;
}

function previewClip(i) {
  if (i < 0 || i >= clips.length) return;
  previewIndex = i;
  const c = clips[i];
  renderBoth(c._imageDataUrl, c.title || '未命名');
  // Update row highlights
  clipList.querySelectorAll('.clip-item').forEach((el, j) => {
    el.classList.toggle('ring-1', j === i);
    el.classList.toggle('ring-blue-500', j === i);
    el.classList.toggle('bg-slate-700', j === i);
    el.classList.toggle('bg-slate-800', j !== i);
  });
}

function updateTitle(clip) {
  const title = clip?.title || '示例标题';
  [previewStage, renderStage].forEach(stage => {
    const titleEl = stage.querySelector('#tmpl-title');
    if (titleEl) titleEl.textContent = title;
  });
  previewHint.classList.add('hidden');
}

// ==================== CLIP MANAGEMENT ====================
function renderClipList() {
  if (clips.length === 0) {
    clipList.innerHTML = `<div class="text-xs text-slate-500 text-center py-8">暂无切片，点击下方按钮添加</div>`;
    previewHint.classList.remove('hidden');
    updateTitle(null);
  } else {
    const collapsed = !listExpanded && clips.length > 3;
    const visible = collapsed ? clips.slice(0, 3) : clips;
    const hiddenCount = clips.length - 3;

    clipList.innerHTML = visible.map((c, i) => {
      const realIndex = collapsed ? i : i;
      return `
      <div class="clip-item flex items-center gap-1.5 rounded-lg px-2 py-1.5 group cursor-pointer ${realIndex === previewIndex ? 'bg-slate-700 ring-1 ring-blue-500' : 'bg-slate-800'}" data-preview="${realIndex}">
        <span class="text-xs text-slate-500 w-7 text-center font-mono flex-shrink-0">${String(realIndex + 1).padStart(2, '0')}</span>
        <input value="${escapeHtml(c.title)}" data-index="${realIndex}" data-field="title"
               class="flex-1 min-w-0 bg-transparent text-sm text-slate-200 focus:outline-none border-b border-transparent focus:border-blue-500 py-0.5 transition"
               placeholder="标题">
        <input value="${escapeHtml(c.imageUrl || '')}" data-index="${realIndex}" data-field="imageUrl"
               class="flex-1 min-w-0 bg-transparent text-xs text-slate-400 focus:outline-none border-b border-transparent focus:border-blue-500 py-0.5 transition"
               placeholder="封面图URL">
        <button data-remove="${realIndex}" class="flex-shrink-0 text-slate-600 hover:text-red-400 transition opacity-0 group-hover:opacity-100 text-lg leading-none" title="删除">&times;</button>
      </div>`;
    }).join('') + (collapsed ? `
      <button id="expand-list-btn" class="w-full text-center text-xs text-slate-400 hover:text-blue-400 py-2 transition">
        展开更多 (${hiddenCount})
      </button>` : '');

    // Bind expand button
    clipList.querySelectorAll('.clip-item').forEach(row => {
      row.addEventListener('click', (e) => {
        // Don't switch preview if clicking on input or button
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'svg' || e.target.tagName === 'path') return;
        previewClip(parseInt(row.dataset.preview));
      });
    });
    clipList.querySelectorAll('[data-field]').forEach(input => {
      input.addEventListener('input', (e) => {
        const i = parseInt(e.target.dataset.index);
        const field = e.target.dataset.field;
        clips[i][field] = e.target.value;
        if (i === previewIndex && field === 'title') previewClip(i);
      });
      if (input.dataset.field === 'imageUrl') {
        input.addEventListener('blur', async () => {
          const i = parseInt(input.dataset.index);
          const url = clips[i].imageUrl;
          if (url && url.trim() && !clips[i]._imageDataUrl) {
            const loaded = await loadImageToDataUrl(url);
            if (loaded) {
              clips[i]._imageDataUrl = loaded;
              if (i === previewIndex) previewClip(i);
            }
          }
        });
      }
    });
    clipList.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        clips.splice(parseInt(btn.dataset.remove), 1);
        if (previewIndex >= clips.length) previewIndex = Math.max(0, clips.length - 1);
        renderClipList();
        if (clips.length > 0) previewClip(previewIndex);
        else { renderBoth(); previewHint.classList.remove('hidden'); }
        checkGenerateReady();
      });
    });

    const expandBtn = clipList.querySelector('#expand-list-btn');
    if (expandBtn) {
      expandBtn.addEventListener('click', () => {
        listExpanded = true;
        renderClipList();
      });
    }

    if (clips.length > 0) previewClip(previewIndex);
  }
}

// Helper: load a URL to base64 data URL, returns dataUrl or original URL
async function loadImageToDataUrl(url) {
  try {
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(url);
      reader.readAsDataURL(blob);
    });
  } catch {
    // CORS fetch failed, try loading without CORS headers
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(url); // return original URL, html2canvas allowTaint handles it
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addClip() {
  clips.push({ title: '', imageUrl: '' });
  renderClipList();
  checkGenerateReady();
}

function checkGenerateReady() {
  const ok = clips.length > 0 && clips.every(c => c.title.trim());
  generateBtn.disabled = !ok || isGenerating;
}

// ==================== EXCEL ====================
function downloadExcelTemplate() {
  if (typeof XLSX === 'undefined') {
    alert('Excel 组件加载失败，请刷新页面后重试。');
    return;
  }
  try {
    const ws = XLSX.utils.aoa_to_sheet([
      ['切片标题', '封面图URL'],
      ['外观解析', 'https://example.com/cover1.jpg'],
      ['内饰详解', 'https://example.com/cover2.jpg'],
    ]);
    ws['!cols'] = [{wch: 24}, {wch: 44}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '切片封面');
    XLSX.writeFile(wb, '切片封面模板.xlsx');
  } catch (err) {
    console.error('下载模板失败:', err);
    alert('下载模板失败，请稍后重试。');
  }
}

function importExcel(file) {
  if (typeof XLSX === 'undefined') {
    alert('Excel 组件加载失败，请刷新页面后重试。');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
      const rows = data.slice(1).filter(r => r[0] && String(r[0]).trim());
      if (rows.length === 0) {
        alert('未在 Excel 中找到有效数据，请检查文件内容。');
        return;
      }
      clips = rows.map((r) => ({
        title: String(r[0] || '').trim(),
        imageUrl: String(r[1] || '').trim(),
      }));
      listExpanded = false;
      renderClipList();
      checkGenerateReady();
      autoLoadAllImages();
    } catch (err) {
      console.error('导入 Excel 失败:', err);
      alert('导入失败，请检查文件格式是否正确。');
    }
  };
  reader.onerror = () => {
    alert('文件读取失败，请重试。');
  };
  reader.readAsArrayBuffer(file);
}

// ==================== GENERATION ====================
async function generateAll() {
  if (isGenerating) return;
  isGenerating = true;
  generateBtn.disabled = true;
  progressContainer.classList.remove('hidden');
  generateBtn.textContent = '打包中...';

  // Preload per-clip images that have URLs but haven't been loaded yet
  for (const clip of clips) {
    if (clip.imageUrl && clip.imageUrl.trim() && !clip._imageDataUrl) {
      const dataUrl = await loadImageToDataUrl(clip.imageUrl);
      if (dataUrl) clip._imageDataUrl = dataUrl;
    }
  }

  const zip = new JSZip();
  const total = clips.length;

  for (let i = 0; i < total; i++) {
    const clip = clips[i];
    const customImage = clip._imageDataUrl || null;

    const tmpl = currentTemplate;

    // Render with per-clip image + title
    const html = buildTemplate(tmpl, customImage, clip.title);
    renderStage.innerHTML = html;

    // Wait for font rendering
    await document.fonts.ready;
    await new Promise(r => setTimeout(r, 100));

    // Capture from hidden render stage at full 1280x720 resolution
    const canvas = await html2canvas(renderStage.firstElementChild, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: null,
    });

    // Resize canvas from 2560x1440 (scale:2) down to 1280x720 for final output
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = 1280;
    finalCanvas.height = 720;
    const ctx = finalCanvas.getContext('2d');
    ctx.drawImage(canvas, 0, 0, 1280, 720);

    const blob = await new Promise(resolve => finalCanvas.toBlob(resolve, 'image/png'));
    zip.file(`${i + 1}-${clip.title}.png`, blob);

    // Update progress
    const pct = Math.round(((i + 1) / total) * 100);
    progressBar.style.width = pct + '%';
    progressText.textContent = `打包中: ${clip.title}`;
    progressCount.textContent = `${i + 1}/${total}`;
  }

  // Package and download
  const zipBlob = await zip.generateAsync({ type: 'blob' });

  try {
    // Try File System Access API (Chrome/Edge) for save dialog
    const handle = await window.showSaveFilePicker({
      suggestedName: '切片封面图.zip',
      types: [{ description: 'ZIP 压缩包', accept: { 'application/zip': ['.zip'] } }],
    });
    const writable = await handle.createWritable();
    await writable.write(zipBlob);
    await writable.close();
  } catch {
    // Fallback: regular download
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '切片封面图.zip';
    a.click();
    URL.revokeObjectURL(url);
  }

  incrementDownloadCount();

  // Restore preview
  if (clips.length > 0) previewClip(previewIndex);

  // Reset UI
  isGenerating = false;
  generateBtn.disabled = false;
  generateBtn.textContent = '下载全部封面图 (ZIP)';
  progressBar.style.width = '0%';
  progressText.textContent = '完成!';
  progressCount.textContent = `${total}/${total}`;
  setTimeout(() => progressContainer.classList.add('hidden'), 2000);
}

// ==================== EVENT BINDINGS ====================
// Template switching
$$('.template-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.template-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTemplate = btn.dataset.template;
    if (clips.length > 0) previewClip(previewIndex);
  });
});

// Mask opacity slider
$('#mask-opacity-slider').addEventListener('input', (e) => {
  maskOpacity = parseInt(e.target.value) / 100;
  $('#mask-opacity-label').textContent = e.target.value + '%';
  if (clips.length > 0) previewClip(previewIndex);
});

// Clip management
$('#add-clip-btn').addEventListener('click', addClip);

// Excel template download
$('#download-template-btn').addEventListener('click', downloadExcelTemplate);

// Excel import
$('#excel-input').addEventListener('change', (e) => {
  if (e.target.files[0]) importExcel(e.target.files[0]);
  e.target.value = '';
});

// Auto-load images for all clips that have URLs but no data yet
async function autoLoadAllImages() {
  for (let i = 0; i < clips.length; i++) {
    const url = clips[i].imageUrl;
    if (url && url.trim() && !clips[i]._imageDataUrl) {
      const loaded = await loadImageToDataUrl(url);
      if (loaded) clips[i]._imageDataUrl = loaded;
    }
  }
  renderClipList();
  if (clips.length > 0) previewClip(previewIndex);
  checkGenerateReady();
}

// Local background image upload
function handleBgFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    localBgDataUrl = reader.result;
    const name = file.name;
    $('#bg-upload-label').textContent = name.length > 18 ? name.slice(0, 15) + '...' : name;
    $('#bg-upload-label').classList.remove('text-slate-400');
    $('#bg-upload-label').classList.add('text-amber-400');
    $('#apply-bg-all-btn').disabled = false;
    $('#reupload-btn').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}
$('#bg-image-input').addEventListener('change', (e) => {
  handleBgFile(e.target.files[0]);
  e.target.value = '';
});
$('#reupload-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#bg-image-input').click();
});

// Apply local background to all clips
$('#apply-bg-all-btn').addEventListener('click', () => {
  if (!localBgDataUrl || clips.length === 0) return;
  for (const clip of clips) {
    clip._imageDataUrl = localBgDataUrl;
  }
  renderClipList();
  if (clips.length > 0) previewClip(previewIndex);
  checkGenerateReady();
});

// Font family selector
$('#font-select').addEventListener('change', (e) => {
  fontFamily = e.target.value;
  if (clips.length > 0) previewClip(previewIndex);
});

// Font settings
$('#color-picker').addEventListener('input', (e) => {
  titleColor = e.target.value;
  if (clips.length > 0) previewClip(previewIndex);
});
$('#stroke-color-picker').addEventListener('input', (e) => {
  strokeColor = e.target.value;
  if (clips.length > 0) previewClip(previewIndex);
});
$('#stroke-width-slider').addEventListener('input', (e) => {
  strokeWidth = parseFloat(e.target.value);
  $('#stroke-width-label').textContent = strokeWidth + 'px';
  if (clips.length > 0) previewClip(previewIndex);
});
$('#size-slider').addEventListener('input', (e) => {
  fontScale = parseInt(e.target.value) / 100;
  $('#size-label').textContent = e.target.value + '%';
  if (clips.length > 0) previewClip(previewIndex);
});

// Generate
generateBtn.addEventListener('click', generateAll);

// Listen for clip list input changes to update button state
clipList.addEventListener('input', checkGenerateReady);

// Keyboard navigation: up/down to switch preview
clipList.addEventListener('keydown', (e) => {
  if (clips.length === 0) return;
  // Don't intercept when editing an input
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    previewIndex = Math.min(previewIndex + 1, clips.length - 1);
    previewClip(previewIndex);
    // Scroll selected row into view
    const row = clipList.querySelector(`[data-preview="${previewIndex}"]`);
    if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    previewIndex = Math.max(previewIndex - 1, 0);
    previewClip(previewIndex);
    const row = clipList.querySelector(`[data-preview="${previewIndex}"]`);
    if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});

// Reset download count
$('#reset-count-btn').addEventListener('click', () => {
  downloadCount = 0;
  localStorage.removeItem('coverDownloadCount');
  updateDownloadCountDisplay();
});

// ==================== LAYOUT ====================
function updateLayoutHeight() {
  const header = document.querySelector("header");
  const h = header ? header.offsetHeight : 56;
  const mainLayout = $("#main-layout");
  if (mainLayout) mainLayout.style.height = "calc(100vh - " + h + "px)";
}
window.addEventListener("resize", updateLayoutHeight);

// ==================== INIT ====================
updateLayoutHeight();
updateDownloadCountDisplay();
renderBoth();
checkGenerateReady();
});
</script>
